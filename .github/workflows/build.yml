# 构建 Android APK 的 GitHub Actions 工作流
# 参考 React-Andorid 项目的做法：
#   push/PR 到 main 自动构建 APK；打 v* 标签时自动发布 GitHub Release 并附带 APK
name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android/package-lock.json

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # android/android 原生目录由 expo prebuild 生成，用 package-lock.json 作为缓存 key
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install Dependencies
        run: npm ci

      - name: Generate Android Project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build APK
        working-directory: android/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

  # 打 v* 标签时发布 Release（附 APK）
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: app-release
          path: ./apk

      - name: Get Version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: ./apk/*.apk
